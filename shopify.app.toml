# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "dafbfec9f51776f79863a71093d0538a"
name = "faque"
application_url = "https://faque.flamaradigital.online"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://faque.flamaradigital.online/webhooks/compliance"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions"

[auth]
redirect_urls = [
  "https://faque.flamaradigital.online/auth/callback",
  "https://faque.flamaradigital.online/auth/shopify/callback",
  "https://faque.flamaradigital.online/api/auth"
]

[app_proxy]
url = "https://faque.flamaradigital.online/api/proxy"
subpath = "faque"
prefix = "apps"
